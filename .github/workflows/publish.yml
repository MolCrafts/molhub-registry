name: publish registry snapshot

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: registry-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish the registry read model
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the approved manifests
        uses: actions/checkout@v4

      - name: Check out the MolHub contract and tools
        uses: actions/checkout@v4
        with:
          repository: MolCrafts/molhub
          # Tooling (registry:validate/build) lives on molhub's integration branch.
          ref: dev
          path: .molhub-tooling

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .molhub-tooling/package-lock.json

      - name: Install the MolHub toolchain
        run: npm ci --prefix .molhub-tooling

      - name: Enforce the data-only repository boundary
        run: npm --prefix .molhub-tooling run registry:layout -- "$GITHUB_WORKSPACE"

      - name: Validate the database
        run: npm --prefix .molhub-tooling run registry:validate -- "$GITHUB_WORKSPACE/artifacts"

      - name: Build deterministic snapshots
        run: npm --prefix .molhub-tooling run registry:build -- "$GITHUB_WORKSPACE/artifacts" "$GITHUB_WORKSPACE/dist"

      - name: Attach source revision metadata
        run: printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_REVISION

      - name: Check read models and provenance exist
        run: test -s dist/registry.json && test -s dist/registry.yaml && test -s dist/SOURCE_REVISION

      - name: Retain the immutable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: molhub-registry-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Detect Cloudflare Pages publish configuration
        id: cloudflare
        env:
          PROJECT: ${{ vars.CLOUDFLARE_REGISTRY_PROJECT }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$PROJECT" ] || [ -z "$API_TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare Pages publish skipped — set CLOUDFLARE_REGISTRY_PROJECT, CLOUDFLARE_API_TOKEN, and CLOUDFLARE_ACCOUNT_ID when ready."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the static registry read model
        if: steps.cloudflare.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_REGISTRY_PROJECT }}
            --branch=${{ github.ref_name }}

      - name: Request a MolHub Web refresh
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.MOLHUB_WEB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::MOLHUB_WEB_DISPATCH_TOKEN is unset; the registry is published, but the product Web snapshot will not refresh automatically."
            exit 0
          fi
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MolCrafts/molhub/dispatches \
            --data "{\"event_type\":\"registry-published\",\"client_payload\":{\"registry_sha\":\"${GITHUB_SHA}\"}}"
