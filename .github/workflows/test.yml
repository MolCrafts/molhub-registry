name: test

# Two tiers (`test / context` decides); see "CI" in README.md.
#
#   fast  a feature-branch push to MolCrafts: test / registry.
#   full  every push to a fork (proven before its pull request), dev and
#         master on MolCrafts, pull requests, tags and dispatches:
#         + test / tooling.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

# One group per file, workflow, event and ref; only a feature ref cancels its
# superseded runs. The canonical block: actions/check-workflows.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci context.yml.
  context:
    permissions:
      contents: read
    name: test
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76

  # This database: data-only layout, every manifest valid, read models build.
  registry:
    name: test / registry
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
        with:
          repository: MolCrafts/molhub
          ref: dev
          path: .molhub-tooling
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
        with:
          working-directory: .molhub-tooling
      - name: Layout, validate, and build the registry
        run: |
          set -euo pipefail
          npm --prefix .molhub-tooling run registry:layout -- "$GITHUB_WORKSPACE"
          npm --prefix .molhub-tooling run registry:validate -- "$GITHUB_WORKSPACE/artifacts"
          npm --prefix .molhub-tooling run registry:build -- "$GITHUB_WORKSPACE/artifacts" "$GITHUB_WORKSPACE/dist"
          test -s dist/registry.json && test -s dist/registry.yaml

  # The MolHub contract and registry tooling this database is judged by.
  tooling:
    name: test / tooling
    needs: context
    if: needs.context.outputs.skip-pr != 'true' && needs.context.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
        with:
          repository: MolCrafts/molhub
          ref: dev
          path: .molhub-tooling
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
        with:
          working-directory: .molhub-tooling
      - name: Layout, validate, and build the registry
        run: |
          set -euo pipefail
          npm --prefix .molhub-tooling run registry:layout -- "$GITHUB_WORKSPACE"
          npm --prefix .molhub-tooling run registry:validate -- "$GITHUB_WORKSPACE/artifacts"
          npm --prefix .molhub-tooling run registry:build -- "$GITHUB_WORKSPACE/artifacts" "$GITHUB_WORKSPACE/dist"
          test -s dist/registry.json && test -s dist/registry.yaml
      - working-directory: .molhub-tooling
        run: |
          npm run contract:check
          npm run lint --workspace @molcrafts/molhub-registry-tools
          npm run typecheck --workspace @molcrafts/molhub-registry-tools
          npm run registry:test

  # The workflows themselves, against the MolCrafts CI scheme.
  workflow-policy:
    name: test / workflows
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/check-workflows@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76

  result:
    name: test / result
    needs: [context, registry, tooling, workflow-policy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; . == "success" or . == "skipped")'
