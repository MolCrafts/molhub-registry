name: validate registry database

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: Validate manifests and build snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the manifest database
        uses: actions/checkout@v4

      - name: Check out the MolHub contract and tools
        uses: actions/checkout@v4
        with:
          repository: MolCrafts/molhub
          # Tooling (registry:validate/build) lives on molhub's integration branch.
          ref: dev
          path: .molhub-tooling

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .molhub-tooling/package-lock.json

      - name: Install the MolHub toolchain
        run: npm ci --prefix .molhub-tooling

      - name: Enforce the data-only repository boundary
        run: npm --prefix .molhub-tooling run registry:layout -- "$GITHUB_WORKSPACE"

      - name: Check the shared contract and registry tooling
        run: |
          npm --prefix .molhub-tooling run contract:check
          npm --prefix .molhub-tooling run lint --workspace @molcrafts/molhub-registry-tools
          npm --prefix .molhub-tooling run typecheck --workspace @molcrafts/molhub-registry-tools
          npm --prefix .molhub-tooling run registry:test

      - name: Validate this database
        run: npm --prefix .molhub-tooling run registry:validate -- "$GITHUB_WORKSPACE/artifacts"

      - name: Build deterministic read models
        run: npm --prefix .molhub-tooling run registry:build -- "$GITHUB_WORKSPACE/artifacts" "$GITHUB_WORKSPACE/dist"

      - name: Check both read models exist
        run: test -s dist/registry.json && test -s dist/registry.yaml
