name: nightly

# Upstream only, weekly: every locator's metadata is still reachable and
# matches its manifest (no artifact is downloaded).
on:
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

# One group per file, workflow, event and ref; a nightly run is never cancelled.
# The canonical block: actions/check-workflows.
concurrency:
  group: nightly-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    name: nightly / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      publish: ${{ steps.context.outputs.publish }}
      source-ref: ${{ steps.context.outputs.source-ref }}
    steps:
      - id: context
        uses: MolCrafts/molcrafts-ci/actions/ci-context@master

  health:
    name: nightly / health
    needs: context
    if: needs.context.outputs.upstream == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.source-ref }}
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@master
        with:
          repository: MolCrafts/molhub
          ref: dev
          path: .molhub-tooling
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@master
        with:
          working-directory: .molhub-tooling
      - name: Layout, validate, and build the registry
        run: |
          set -euo pipefail
          npm --prefix .molhub-tooling run registry:layout -- "$GITHUB_WORKSPACE"
          npm --prefix .molhub-tooling run registry:validate -- "$GITHUB_WORKSPACE/artifacts"
          npm --prefix .molhub-tooling run registry:build -- "$GITHUB_WORKSPACE/artifacts" "$GITHUB_WORKSPACE/dist"
          test -s dist/registry.json && test -s dist/registry.yaml
      - name: Check locator metadata
        id: health
        continue-on-error: true
        env:
          TOOLING: .molhub-tooling
        run: npm --prefix "$TOOLING" run registry:health -- "$GITHUB_WORKSPACE/dist/registry.json" "$GITHUB_WORKSPACE/registry-health-report.json"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: registry-health-${{ github.run_id }}
          path: registry-health-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Summarize failures by source and coordinate
        if: always()
        run: >-
          jq -r '.results[] | select(.ok == false) | "- `\(.source)` `\(.coordinate)#\(.role)`: \(.message)"' registry-health-report.json
          >> "$GITHUB_STEP_SUMMARY"
      - if: steps.health.outcome == 'failure'
        run: exit 1
